<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¡Para ti! ✨</title>

  <!-- Google Fonts & Bootstrap 5 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --mini-size: 28px;
      --big-size: 36px;
      --font-handwriting: 'Caveat', cursive;
      --font-main: 'Montserrat', sans-serif;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: var(--font-main);
      user-select: none;
    }

    body {
      background: #050508;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 1.5s ease;
    }

    /* Fondo Mágico de Atardecer */
    body.atardecer {
      animation: bodySunset 8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes bodySunset {
      0%   { background: #050508; }
      25%  { background: radial-gradient(circle at center, #2c1635 0%, #090a10 100%); }
      60%  { background: radial-gradient(circle at center, #ff5e62 0%, #3a1c71 100%); }
      100% { background: linear-gradient(to top, #ffe3c8 0%, #7bc6ec 100%); }
    }

    body.day {
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
    }

    /* Contenedor Principal */
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Capa de destellos / Partículas */
    #sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .sparkle {
      position: absolute;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px #fff, 0 0 20px #ffea79;
      opacity: 0;
      animation: sparkleFade 3s infinite ease-in-out;
    }

    @keyframes sparkleFade {
      0%, 100% { opacity: 0; transform: scale(0.2); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    /* Escena Central de Flor Gigante */
    .escena {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(500px, 85vw);
      height: min(500px, 85vw);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }

    /* Flor SVG Inicial */
    svg#flowerSvg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 10px 25px rgba(255, 180, 0, 0.35));
    }

    #sol {
      transform-origin: 100px 100px;
      transform: scale(0);
      transition: transform 1000ms cubic-bezier(.17,.89,.32,1.28);
      filter: drop-shadow(0 0 20px #ffb300);
    }

    .petal-group {
      transform-box: view-box;
      transform-origin: 100px 100px;
      transform: rotate(0deg) scale(0);
      transition: transform 700ms cubic-bezier(.17,.89,.32,1.28);
    }

    .petal-group.sway {
      animation: petalSway 4s ease-in-out infinite alternate;
    }

    @keyframes petalSway {
      0%   { transform: rotate(var(--ang)) scale(1); }
      100% { transform: rotate(calc(var(--ang) + 4deg)) scale(1.03); }
    }

    .petal {
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 0.8;
    }

    /* Mensaje Medio */
    #midMsg {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%) translateY(20px);
      font-family: var(--font-handwriting);
      font-size: 2.2rem;
      color: #4a3200;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 0.4rem 1.8rem;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      opacity: 0;
      transition: all 600ms cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
    }

    #midMsg.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Stage de Flores Múltiples */
    #flowersStage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    /* Flores Mini */
    .mini {
      position: absolute;
      width: var(--mini-size);
      height: var(--mini-size);
      transform: scale(0) rotate(0deg);
      opacity: 0;
      transition:
        left 1.3s cubic-bezier(.25,1,.5,1),
        top 1.3s cubic-bezier(.25,1,.5,1),
        transform 700ms ease,
        opacity 600ms ease,
        width 600ms ease,
        height 600ms ease;
      will-change: left, top, transform;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.15));
    }

    .mini.show {
      transform: scale(1) rotate(var(--rot, 0deg));
      opacity: 1;
    }

    .mini svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .mini.big {
      width: var(--big-size);
      height: var(--big-size);
    }

    /* Papel y Envoltura del Ramo Buchón */
    #buchonWrapper {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateY(50px) scale(0.8);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      transition: all 1000ms cubic-bezier(0.25, 1, 0.5, 1);
    }

    #buchonWrapper.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .wrapper-paper {
      width: min(340px, 85vw);
      height: 220px;
      background: linear-gradient(135deg, #111111 0%, #221c16 100%);
      border: 2px solid #dfb15b;
      clip-path: polygon(0% 25%, 18% 0%, 50% 12%, 82% 0%, 100% 25%, 78% 100%, 22% 100%);
      box-shadow: 0 15px 35px rgba(0,0,0,0.35);
      position: relative;
    }

    .wrapper-ribbon {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 55px;
      height: 22px;
      background: #dfb15b;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .wrapper-ribbon::before, .wrapper-ribbon::after {
      content: '';
      position: absolute;
      top: 100%;
      width: 18px;
      height: 35px;
      background: #dfb15b;
    }
    .wrapper-ribbon::before { left: 4px; transform: rotate(15deg); }
    .wrapper-ribbon::after { right: 4px; transform: rotate(-15deg); }

    /* Overlay y Carta Final (ARRIBA PARA NO TAPAR EL RAMO) */
    #finalOverlay {
      position: absolute;
      top: 6%;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      padding: 0 1rem;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 1.2rem 2rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      text-align: center;
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
      transition: all 900ms cubic-bezier(0.17, 0.89, 0.32, 1.28);
      max-width: 90vw;
    }

    .glass-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #finalText {
      font-family: var(--font-handwriting);
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      color: #2c1d11;
      font-weight: 700;
      margin: 0;
      text-shadow: 0 2px 10px rgba(255,255,255,0.5);
    }

    .btn-replay {
      margin-top: 0.8rem;
      background: #ffb300;
      color: #fff;
      border: none;
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      font-family: var(--font-main);
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 0 4px 12px rgba(255, 179, 0, 0.4);
      transition: all 300ms ease;
      cursor: pointer;
    }

    .btn-replay:hover {
      background: #ffa000;
      transform: scale(1.05);
    }

    @media (max-width: 576px) {
      :root { --mini-size: 22px; --big-size: 30px; }
      #midMsg { font-size: 1.5rem; bottom: 8%; }
      .glass-card { padding: 1rem 1.2rem; }
      .wrapper-paper { width: 280px; height: 180px; }
    }
  </style>
</head>
<body>

  <div id="stage">
    <!-- Capa de Destellos -->
    <div id="sparkles"></div>

    <!-- Escena Central -->
    <div class="escena">
      <svg id="flowerSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="gSol" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="40%" stop-color="#ffea79"/>
            <stop offset="100%" stop-color="#ffb300"/>
          </radialGradient>
        </defs>
        <circle id="sol" cx="100" cy="100" r="20" fill="url(#gSol)"></circle>
        <g id="petalsRoot"></g>
      </svg>
      <div id="midMsg"></div>
    </div>

    <!-- Envoltura Papel Ramo Buchón -->
    <div id="buchonWrapper">
      <div class="wrapper-paper"></div>
      <div class="wrapper-ribbon"></div>
    </div>

    <!-- Escena Flores Múltiples -->
    <div id="flowersStage"></div>

    <!-- Carta / Mensaje Final -->
    <div id="finalOverlay">
      <div class="glass-card" id="cardContainer">
        <h1 id="finalText"></h1>
        <button class="btn-replay" onclick="location.reload()">Ver de nuevo ✨</button>
      </div>
    </div>
  </div>

<script>
const wait = ms => new Promise(res => setTimeout(res, ms));
const W = () => window.innerWidth;
const H = () => window.innerHeight;

const bodyEl = document.body;
const solEl = document.getElementById('sol');
const petalsRoot = document.getElementById('petalsRoot');
const midMsg = document.getElementById('midMsg');
const flowersStage = document.getElementById('flowersStage');
const buchonWrapper = document.getElementById('buchonWrapper');
const cardContainer = document.getElementById('cardContainer');
const finalText = document.getElementById('finalText');

/* Generar destellos de fondo */
function initSparkles() {
  const container = document.getElementById('sparkles');
  const count = 35;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = Math.random() * 4 + 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.animationDuration = (Math.random() * 2 + 2) + 's';
    container.appendChild(s);
  }
}

(async function run() {
  try {
    initSparkles();

    // 1) Atardecer
    await wait(300);
    bodyEl.classList.add('atardecer');

    // 2) Aparece Sol
    await wait(1000);
    solEl.style.transform = 'scale(1)';

    // 3) Nacer de la Flor Amarilla Gigante
    await wait(600);
    const PETALS = 14;
    const radiusOffset = 42;
    for (let i = 0; i < PETALS; i++) {
      const angle = i * (360 / PETALS);
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'petal-group');
      g.style.setProperty('--ang', angle + 'deg');

      const e = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      e.setAttribute('cx', '100'); 
      e.setAttribute('cy', String(100 - radiusOffset));
      e.setAttribute('rx', '20'); 
      e.setAttribute('ry', '38');
      e.setAttribute('class', 'petal');

      const hue = 48 + Math.floor(Math.random() * 8);
      e.setAttribute('fill', `hsl(${hue}, 100%, 60%)`);

      g.appendChild(e);
      petalsRoot.appendChild(g);

      await wait(180);
      g.style.transform = `rotate(${angle}deg) scale(1)`;
      setTimeout(() => g.classList.add('sway'), 800 + Math.random() * 400);
    }

    // 4) Mensaje intermedio
    await wait(800);
    midMsg.textContent = 'Espera un segundo... ✨';
    midMsg.classList.add('visible');

    await wait(2000);
    midMsg.classList.remove('visible');

    // Desvanecer flor inicial
    const flowerSvg = document.getElementById('flowerSvg');
    flowerSvg.style.transition = 'opacity 800ms ease, transform 800ms ease';
    flowerSvg.style.opacity = '0';
    flowerSvg.style.transform = 'scale(0.5) translateY(-30px)';

    // 5) Transición al día
    await wait(600);
    bodyEl.classList.remove('atardecer');
    bodyEl.classList.add('day');

    await wait(400);
    flowerSvg.style.display = 'none';

    // 6) Lluvia / Explosión de Flores
    const TOTAL_FLOWERS = 110;
    const flowers = [];
    for (let i = 0; i < TOTAL_FLOWERS; i++) {
      const f = createMiniFlower();
      f.style.left = Math.random() * W() + 'px';
      f.style.top = Math.random() * H() + 'px';
      
      const randomRot = (Math.random() * 60 - 30) + 'deg';
      f.style.setProperty('--rot', randomRot);

      flowersStage.appendChild(f);
      flowers.push(f);

      setTimeout(() => f.classList.add('show'), 12 * i);
      await wait(6);
    }

    await wait(1000);

    // 7) Formar ESTRELLA BRILLANTE ⭐
    function starParametric(t) {
      const r = 12 * (Math.sin(5 * t) * 0.4 + 0.8);
      const x = r * Math.cos(t);
      const y = r * Math.sin(t);
      return [x, y];
    }

    const centerX = W() / 2;
    const centerY = H() / 2 - 10;
    const starScale = Math.min(W(), H()) / 25;

    for (let i = 0; i < TOTAL_FLOWERS; i++) {
      const t = (i / TOTAL_FLOWERS) * Math.PI * 2;
      const [sx, sy] = starParametric(t);
      const tx = centerX + sx * starScale;
      const ty = centerY - sy * starScale;
      const el = flowers[i];

      const w = parseFloat(getComputedStyle(el).width);
      const h = parseFloat(getComputedStyle(el).height);

      el.style.left = (tx - w / 2) + 'px';
      el.style.top = (ty - h / 2) + 'px';
      el.style.transform = `scale(1.1) rotate(${Math.random() * 40 - 20}deg)`;

      await wait(10);
    }

    await wait(1800);

    // 8) Formar RAMO BUCHÓN (Posicionamiento en Domo)
    const buchonBaseY = H() - (W() < 576 ? 160 : 200);
    buchonWrapper.style.top = (buchonBaseY - 40) + 'px';
    buchonWrapper.classList.add('show');

    await wait(400);

    // Domo circular bien tupido sobre el papel
    const radiusMax = Math.min(W() * 0.38, 140);
    
    for (let i = 0; i < TOTAL_FLOWERS; i++) {
      const phi = i * 137.5 * (Math.PI / 180);
      const r = Math.sqrt(i / TOTAL_FLOWERS) * radiusMax;
      
      const tx = centerX + r * Math.cos(phi) + (Math.random() * 4 - 2);
      const ty = (buchonBaseY - 90) + (r * 0.7 * Math.sin(phi)) + (Math.random() * 4 - 2);

      const el = flowers[i];
      const w = parseFloat(getComputedStyle(el).width);
      const h = parseFloat(getComputedStyle(el).height);

      el.style.left = (tx - w / 2) + 'px';
      el.style.top = (ty - h / 2) + 'px';
      el.classList.add('big');
      el.style.zIndex = Math.floor(r) + 5;

      await wait(10);
    }

    await wait(1000);

    // 9) Mostrar Carta Final en la parte superior
    finalText.innerHTML = '🌼 Para ti,<br>que nunca serás espectadora ✨';
    cardContainer.classList.add('visible');

  } catch (err) {
    console.error('Error en la secuencia:', err);
  }
})();

/* Generador de Flores SVG */
function createMiniFlower() {
  const div = document.createElement('div');
  div.className = 'mini';

  const petalsCount = 7;
  let petalsSvg = '';
  for (let i = 0; i < petalsCount; i++) {
    const ang = i * (360 / petalsCount);
    const hue = 48 + Math.floor(Math.random() * 10 - 5);
    petalsSvg += `<g transform="rotate(${ang} 50 50)">
      <ellipse cx="50" cy="26" rx="11" ry="24" fill="hsl(${hue}, 100%, 60%)" stroke="rgba(255,255,255,0.4)" stroke-width="0.6"/>
    </g>`;
  }

  div.innerHTML = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${petalsSvg}
    <circle cx="50" cy="50" r="9" fill="#ff9100" />
    <circle cx="50" cy="50" r="7" fill="#ffd500" />
  </svg>`;

  div.style.left = '-9999px';
  div.style.top = '-9999px';
  return div;
}
</script>
</body>
</html>
